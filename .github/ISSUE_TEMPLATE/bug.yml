name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué hiciste, qué esperabas y qué ocurrió.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Entrar en…\n2. Pulsar…\n3. Ver…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Está al final de Perfil → Ajustes (p. ej. "v1.0.0 · abc1234").
  - type: dropdown
    id: plataforma
    attributes:
      label: Dónde
      options: [Web / PWA, App Android, Reloj Wear OS, Servidor MCP]
