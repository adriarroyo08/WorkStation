name: Android (móvil + Wear OS)

on:
  push:
    branches: [main]
    paths: ['app/**', 'shared/**', 'android/**', '.github/workflows/android.yml']
    tags: ['v*']
  # Las PR que tocan Android (p. ej. Dependabot) compilan los APK antes de fusionarse.
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Web (se empaqueta dentro del APK del móvil)
        run: npm ci && npm run build
        working-directory: app
        # Variables del repo (opcionales): la app ya viene conectada a Supabase.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Clave de firma desde secrets (Settings → Secrets and variables → Actions):
      #   WS_KEYSTORE_B64 = base64 del .jks · WS_KEYSTORE_PASSWORD · WS_KEY_ALIAS · WS_KEY_PASSWORD
      # Sin secret se genera una clave temporal: funciona, pero cada build tendrá firma distinta
      # (habría que desinstalar para actualizar y se perderían los datos de la app).
      - name: Clave de firma
        working-directory: android
        env:
          WS_KEYSTORE_B64: ${{ secrets.WS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$WS_KEYSTORE_B64" ]; then
            echo "$WS_KEYSTORE_B64" | base64 -d > keystore/workstation.jks
          else
            echo "::warning::Sin secret WS_KEYSTORE_B64: se usa una clave temporal (las actualizaciones requerirán reinstalar)."
            keytool -genkeypair -keystore keystore/workstation.jks -storepass workstation -keypass workstation -alias workstation -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Workstation"
          fi

      - name: Compilar APKs
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.3.${{ github.run_number }}
          WS_KEYSTORE_PASSWORD: ${{ secrets.WS_KEYSTORE_PASSWORD || 'workstation' }}
          WS_KEY_ALIAS: ${{ secrets.WS_KEY_ALIAS || 'workstation' }}
          WS_KEY_PASSWORD: ${{ secrets.WS_KEY_PASSWORD || 'workstation' }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # Si falla, el motivo se publica como anotación para verlo sin abrir el log.
          if ! ./gradlew --no-daemon :phone:assembleRelease :wear:assembleRelease 2>&1 | tee gradle.log; then
            { grep -E -A14 "What went wrong" gradle.log | head -30; grep -E "^e: |error:" gradle.log | head -15; } | grep -v "^--$" | while IFS= read -r l; do echo "::error title=Gradle::$l"; done
            exit 1
          fi
          mkdir -p ../apk
          cp phone/build/outputs/apk/release/phone-release.apk ../apk/workstation-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk ../apk/workstation-wear.apk

      - uses: actions/upload-artifact@v7
        with:
          name: workstation-apks
          path: apk/*.apk

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
