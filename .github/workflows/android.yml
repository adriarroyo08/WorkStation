name: Android (móvil + Wear OS)

on:
  push:
    branches: [main]
    paths: ['app/**', 'shared/**', 'android/**', 'scripts/check-android-signing.mjs', '.github/workflows/android.yml']
    tags: ['v*']
  # Las PR que tocan Android (p. ej. Dependabot) compilan los APK antes de fusionarse.
  pull_request:
    paths: ['android/**', 'scripts/check-android-signing.mjs', 'shared/android-signing.ts', '.github/workflows/android.yml']
  workflow_dispatch:

# Escritura solo para crear la release en tags v* (action-gh-release). En PR de forks y de
# Dependabot GitHub la rebaja a solo lectura.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Comprobar secrets de firma
        run: node --experimental-strip-types scripts/check-android-signing.mjs
        env:
          WS_KEYSTORE_B64: ${{ secrets.WS_KEYSTORE_B64 }}
          WS_KEYSTORE_PASSWORD: ${{ secrets.WS_KEYSTORE_PASSWORD }}
          WS_KEY_ALIAS: ${{ secrets.WS_KEY_ALIAS }}
          WS_KEY_PASSWORD: ${{ secrets.WS_KEY_PASSWORD }}

      - name: Web (se empaqueta dentro del APK del móvil)
        run: npm ci && npm run build
        working-directory: app
        # Variables del repo (opcionales): la app ya viene conectada a Supabase.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Clave de firma desde secrets (Settings → Secrets and variables → Actions):
      #   WS_KEYSTORE_B64 = base64 del .jks · WS_KEYSTORE_PASSWORD · WS_KEY_ALIAS · WS_KEY_PASSWORD
      # En PR sin secrets se genera una clave temporal: cada build tendrá firma distinta
      # (habría que desinstalar para actualizar y se perderían los datos de la app).
      - name: Clave de firma
        working-directory: android
        env:
          WS_KEYSTORE_B64: ${{ secrets.WS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          if [ -n "$WS_KEYSTORE_B64" ]; then
            echo "$WS_KEYSTORE_B64" | base64 -d > keystore/workstation.jks
          else
            echo "::warning::Sin secret WS_KEYSTORE_B64: se usa una clave temporal (las actualizaciones requerirán reinstalar)."
            keytool -genkeypair -keystore keystore/workstation.jks -storepass workstation -keypass workstation -alias workstation -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Workstation"
          fi

      - name: Compilar APKs
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          WS_KEYSTORE_PASSWORD: ${{ secrets.WS_KEYSTORE_PASSWORD }}
          WS_KEY_ALIAS: ${{ secrets.WS_KEY_ALIAS }}
          WS_KEY_PASSWORD: ${{ secrets.WS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # Si falla, el motivo se publica como anotación para verlo sin abrir el log.
          if ! ./gradlew --no-daemon :phone:assembleRelease :wear:assembleRelease 2>&1 | tee gradle.log; then
            { grep -E -A14 "What went wrong" gradle.log | head -30; grep -E "^e: |error:" gradle.log | head -15; } | grep -v "^--$" | while IFS= read -r l; do echo "::error title=Gradle::$l"; done
            exit 1
          fi
          mkdir -p ../apk
          cp phone/build/outputs/apk/release/phone-release.apk ../apk/workstation-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk ../apk/workstation-wear.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstation-apks
          path: apk/*.apk

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: apk/*.apk

      - name: Publicar en MyStore (móvil)
        if: github.event_name == 'push'
        continue-on-error: true   # la tienda rechaza (409) un versionCode ya publicado; no rompe la release
        uses: adriarroyo08/mystore@f617a436d755ba46e268023adfc83a8523e4d296 # v1.0.0
        with:
          store-url: https://tienda.automatito.win
          token: ${{ secrets.MYSTORE_TOKEN }}
          apk: apk/workstation-phone.apk

      - name: Publicar en MyStore (Wear OS)
        if: github.event_name == 'push'
        continue-on-error: true   # la tienda rechaza (409) un versionCode ya publicado; no rompe la release
        uses: adriarroyo08/mystore@f617a436d755ba46e268023adfc83a8523e4d296 # v1.0.0
        with:
          store-url: https://tienda.automatito.win
          token: ${{ secrets.MYSTORE_TOKEN }}
          apk: apk/workstation-wear.apk
