name: Supabase (funciones)

# Despliega la Edge Function "mcp" en tu proyecto. Necesita los secrets
# SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) y SUPABASE_PROJECT_REF (id del proyecto).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'shared/**', 'mcp/src/edge.ts']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Comprobar secrets
        id: check
        env:
          HAS_DEPLOY_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
        run: |
          if [ "$HAS_DEPLOY_SECRETS" != "true" ]; then
            echo "::notice::Sin SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF: se omite el despliegue."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Empaquetar función
        if: steps.check.outputs.skip != 'true'
        run: npm --prefix mcp ci --ignore-scripts && npm --prefix mcp run build:edge
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        if: steps.check.outputs.skip != 'true'
      - name: Desplegar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        if: steps.check.outputs.skip != 'true'
        run: |
          supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy welcome --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
