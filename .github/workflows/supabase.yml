name: Supabase (función MCP)

# Despliega la Edge Function "mcp" en tu proyecto. Necesita los secrets
# SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens) y SUPABASE_PROJECT_REF (id del proyecto).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'shared/**', 'mcp/src/edge.ts']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Sin SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF: se omite el despliegue."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Empaquetar función
        if: steps.check.outputs.skip != 'true'
        run: npm --prefix mcp ci && npm --prefix mcp run build:edge
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
      - name: Desplegar
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
