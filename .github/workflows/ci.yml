name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lee el repo: no publica nada ni usa la API de GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            mcp/package-lock.json
            video/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix mcp ci
          npm --prefix video ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Tests y cobertura
        run: npm run test:coverage
      - name: Build web y MCP
        run: npm --prefix app run build && npm --prefix mcp run build
      - name: Función MCP remota al día
        run: |
          npm --prefix mcp run build:edge
          git diff --exit-code supabase/functions/mcp/index.ts || (echo "::error::supabase/functions/mcp/index.ts está desactualizado: ejecuta npm --prefix mcp run build:edge" && exit 1)
      - name: Instalar Chromium para e2e
        run: npx playwright install --with-deps chromium
      - name: Tests e2e
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
