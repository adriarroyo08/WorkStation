version: 2
# Agrupado para que las dependencias que deben subir juntas lleguen en un solo PR
# (p. ej. eslint + @eslint/js, o Kotlin + su plugin de Compose).
updates:
  - package-ecosystem: npm
    directories: ['/', '/app', '/mcp', '/video']
    schedule: { interval: weekly }
    groups:
      minor-y-parches:
        update-types: [minor, patch]
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*']
      remotion:
        patterns: ['remotion', '@remotion/*']
    # TypeScript 7 en la raíz rompe la instalación: typescript-eslint 8 exige typescript <6.1.0.
    # Quitar cuando typescript-eslint admita TypeScript 7 (app/, mcp/ y video/ ya están en 7 y
    # siguen recibiendo menores y parches).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    groups:
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'org.jetbrains.kotlinx*']
      android-gradle-plugin:
        patterns: ['com.android.*']
      androidx:
        patterns: ['androidx.*', 'com.google.android.*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
