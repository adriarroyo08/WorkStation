# Configuración de la Supabase CLI para Workstation.
# La función "mcp" valida sus propias API keys (ws_…), así que no usa el JWT de Supabase.
[functions.mcp]
verify_jwt = false

# "welcome" la llama un trigger de la base de datos (012_welcome_secret.sql) con un secreto compartido, sin JWT.
[functions.welcome]
verify_jwt = false
